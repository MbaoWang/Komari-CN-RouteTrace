<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>回程路由檢測</title>
<style>
  /* 字體與 Komari-Theme-LuminaPlus 一致：Inter Variable（隨插件打包，SIL OFL 1.1，見 fonts/Inter-OFL.txt）＋ 系統中文字體 */
  @font-face {
    font-family: "Inter Variable";
    font-style: normal;
    font-display: swap;
    font-weight: 100 900;
    src: url(fonts/inter-latin-wght-normal.woff2) format("woff2-variations");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  :root {
    /* 與 LuminaPlus 完全相同的字體順序（Windows 上中文為微軟雅黑） */
    --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter Variable", "Inter",
      system-ui, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, monospace;
    --font-numeric: "Inter Variable", "Inter", ui-sans-serif, system-ui, sans-serif;
    /* LuminaPlus 的文字渲染設定 */
    font-family: var(--font-sans);
    font-synthesis: none;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    letter-spacing: -0.003em;
  }
  :root {
    --bg: #f6f7f9; --card: #ffffff; --fg: #1d2129; --muted: #6b7280; --line: #e5e7eb;
    --accent: #2563eb; --ct: #2563eb; --cu: #dc2626; --cm: #059669; --warn: #b45309; --chip: #eef2ff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --card: #171a21; --fg: #e5e7eb; --muted: #9ca3af; --line: #2a2f3a;
      --accent: #60a5fa; --ct: #60a5fa; --cu: #f87171; --cm: #34d399; --warn: #fbbf24; --chip: #1e2533; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-size: 14px; line-height: 1.5; font-family: var(--font-sans); }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding: 16px; }
  h1 { font-size: 18px; margin: 0; }
  .sub { color: var(--muted); font-size: 12px; }
  main { padding: 0 16px 24px; display: grid; gap: 12px; }
  .node { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .node > summary { list-style: none; cursor: pointer; padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .node > summary::-webkit-details-marker { display: none; }
  .name { font-weight: 600; font-size: 15px; }
  .ip { font-family: var(--font-mono); color: var(--muted); font-size: 12px; }
  .spacer { flex: 1; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--chip); font-size: 12px; white-space: nowrap; }
  .chip.ct { color: var(--ct); } .chip.cu { color: var(--cu); } .chip.cm { color: var(--cm); }
  .chip.bad { color: var(--warn); }
  .err { color: var(--warn); padding: 0 14px 12px; }
  table { width: 100%; border-collapse: collapse; }
  .targets { border-top: 1px solid var(--line); }
  .t { border-bottom: 1px solid var(--line); }
  .t:last-child { border-bottom: 0; }
  .t > summary { cursor: pointer; padding: 10px 14px; display: grid; grid-template-columns: 90px 1fr auto; gap: 8px; align-items: center; list-style: none; }
  .t > summary::-webkit-details-marker { display: none; }
  .label { font-weight: 600; }
  .label.ct { color: var(--ct); } .label.cu { color: var(--cu); } .label.cm { color: var(--cm); }
  .aspath { font-family: var(--font-mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .rtt { font-family: var(--font-numeric); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .hopn, .cell .meta { font-family: var(--font-numeric); }
  .segs { padding: 4px 14px 12px; display: grid; gap: 6px; }
  .seg { display: grid; grid-template-columns: 80px 1fr auto; gap: 8px; padding: 6px 10px; border-left: 3px solid var(--accent); background: var(--bg); border-radius: 4px; }
  .seg.lan { border-left-color: var(--line); }
  .asn { font-family: var(--font-mono); font-weight: 600; }
  .ips { font-family: var(--font-mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .hopn { color: var(--muted); font-size: 12px; white-space: nowrap; text-align: right; }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button[disabled] { opacity: .5; cursor: default; }
  .empty { color: var(--muted); padding: 24px; text-align: center; }
  .nhead { padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .grid { display: grid; grid-template-columns: fit-content(120px) repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--line); }
  .grid > div { padding: 8px 10px; border-bottom: 1px solid var(--line); min-width: 0; }
  .grid .gh { color: var(--muted); font-size: 12px; padding-top: 6px; padding-bottom: 6px; }
  .grid .gh.ct { color: var(--ct); } .grid .gh.cu { color: var(--cu); } .grid .gh.cm { color: var(--cm); }
  .grid .rg { font-weight: 600; display: flex; align-items: center; overflow-wrap: anywhere; min-width: 64px; box-sizing: border-box; }
  .grid .other { grid-column: 2 / -1; }
  .cell { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; text-align: left;
    border: 1px solid transparent; background: transparent; padding: 4px 6px; border-radius: 6px; cursor: pointer; font: inherit; color: inherit; }
  .cell:hover { border-color: var(--line); }
  .cell.on { border-color: var(--accent); background: var(--chip); }
  .cell .chip { white-space: normal; text-align: left; }
  .cell .chain { font-size: 12px; color: var(--fg); overflow-wrap: anywhere; }
  .cell .meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .cell.none { cursor: default; color: var(--muted); font-size: 12px; }
  .detail { border-bottom: 1px solid var(--line); }
  .detail .dh { padding: 10px 14px 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .detail .aspath { padding: 4px 14px 0; display: block; }
  @media (max-width: 640px) {
    .grid { grid-template-columns: fit-content(76px) repeat(3, minmax(0, 1fr)); }
    .grid > div { padding: 6px 4px; }
    .grid .rg { min-width: 44px; }
    .cell { padding: 3px 4px; }
    .cell .chip { font-size: 11px; padding: 1px 6px; }
  }
  .embed header h1 { display: none; }
  .embed header { padding-top: 10px; }
  .why { padding: 6px 10px; font-size: 12px; color: var(--muted); display: grid; gap: 2px; }
  .why b { color: var(--fg); font-weight: 600; }
  .seg-ctl { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin-right: 8px; }
  .seg-ctl button { border: 0; border-radius: 0; }
  .seg-ctl button.on { background: var(--accent); color: #fff; }
  @media (max-width: 560px) {
    .t > summary { grid-template-columns: 70px 1fr; }
    .t > summary .rtt { grid-column: 2; }
    .seg { grid-template-columns: 70px 1fr; }
    .seg .hopn { grid-column: 2; text-align: left; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1 id="title"></h1>
    <div class="sub" id="sub">…</div>
  </div>
  <div id="actions"></div>
</header>
<main id="list"></main>
<script src="i18n.js"></script>
<script>
// 在 Komari 的彈出視窗裡時（同網域），沿用面板主題實際的字體與 @font-face，換主題也會一致
(function inheritThemeFont() {
  try {
    if (window.parent === window) return;
    const pd = window.parent.document;
    const pcs = window.parent.getComputedStyle(pd.body);
    const root = document.documentElement.style;
    if (pcs.fontFamily) root.setProperty("--font-sans", pcs.fontFamily);
    for (const k of ["letterSpacing", "webkitFontSmoothing", "textRendering", "fontSynthesis"]) {
      if (pcs[k]) document.documentElement.style[k] = pcs[k];
    }
    const code = pd.querySelector("code, pre, kbd, samp");
    if (code) root.setProperty("--font-mono", window.parent.getComputedStyle(code).fontFamily);
    // 複製字型檔宣告（相對網址改成絕對網址）
    const rules = [];
    for (const sheet of pd.styleSheets) {
      let list;
      try { list = sheet.cssRules; } catch (_) { continue; } // 跨網域樣式表讀不到
      if (!list) continue;
      const base = sheet.href || window.parent.location.href;
      for (const r of list) {
        if (r.type !== 5) continue; // CSSRule.FONT_FACE_RULE
        rules.push(r.cssText.replace(/url\((['"]?)([^'")]+)\1\)/g, (m, q, u) => {
          try { return "url(" + q + new URL(u, base).href + q + ")"; } catch (_) { return m; }
        }));
      }
    }
    if (rules.length) {
      const st = document.createElement("style");
      st.textContent = rules.join("\n");
      document.head.appendChild(st);
    }
  } catch (_) { /* 不在同網域或無法讀取時，使用上面的 LuminaPlus 字體設定 */ }
})();

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ---------- 語系：跟隨 Komari 面板 ----------
// komari-web 把語言存在 localStorage / cookie 的 "language"（zh-TW、zh-CN、en-US、ja-JP…），
// 並設定 <html lang>；在面板的彈出視窗裡時也看父頁面。都沒有時用瀏覽器語言。
const I = window.CNI18N;
function detectLang() {
  const tries = [];
  try { tries.push(localStorage.getItem("language")); } catch (_) {}
  try { const m = document.cookie.match(/(?:^|;\s*)language=([^;]+)/); if (m) tries.push(decodeURIComponent(m[1])); } catch (_) {}
  try { if (window.parent !== window) tries.push(window.parent.document.documentElement.lang); } catch (_) {}
  tries.push(...(navigator.languages || []), navigator.language);
  for (const x of tries) { const l = x && I.resolve(x); if (l) return l; }
  return "en";
}
let L = detectLang();
const T = (k, p) => I.t(L, k, p);
function applyLang() {
  document.documentElement.lang = L === "zh-TW" ? "zh-Hant" : L === "zh-CN" ? "zh-Hans" : L;
  document.title = T("page.title");
  document.getElementById("title").textContent = T("page.title");
}
applyLang();
// 面板切換語言時跟著換（同網域的其他分頁 / 父頁面改了 localStorage）
function relang() {
  const n = detectLang();
  if (n === L) return;
  L = n;
  applyLang();
  if (lastData) render(lastData);
}
window.addEventListener("storage", (e) => { if (!e.key || e.key === "language") relang(); });

// 顏色一律依目標所屬的電信商（欄位）：電信藍、聯通紅、移動綠；沒有電信商的自訂目標用中性色
const ispColor = (t) => (["ct", "cu", "cm"].includes(t.isp) ? t.isp : "");
let isAdmin = false;
// 浮動按鈕開啟時帶 ?embed=1：唯讀檢視，不顯示檢測按鈕與頁首
const EMBED = new URLSearchParams(location.search).get("embed") === "1";
if (EMBED) document.documentElement.classList.add("embed");
let lastData = null;
let ver = 4;
try { ver = Number(localStorage.getItem("cnroute-ver")) === 6 ? 6 : 4; } catch (_) {}
// 標準 / 大包（TCP 大封包）分頁
let mode = "std";
try { mode = localStorage.getItem("cnroute-mode") === "big" ? "big" : "std"; } catch (_) {}
const tKey = (t) => "v" + ver + ":" + mode + ":" + t.label + ":" + t.ip;
const confText = (t) => (t.route ? I.confText(L, t.route.confidence) : "");
const tagText = (t) => {
  const base = t.route ? I.label(L, t.route) || (t.tags || [])[0] || "" : (t.tags || [])[0] || "";
  const c = confText(t);
  return base + I.paren(L, c);
};
// 格子第一行：怎麼交接進中國（例如 4134(163)、Lumen → CMI、CTGNet → 4134(163) → 4837(169)）
const cellMain = (t) => {
  const r = t.route || {};
  const c = I.chip(L, r);
  if (c) return c;
  return r.short ? (r.cross_text ? r.carrier_name + " " : "") + r.short : tagText(t); // 舊版結果
};
// 格子第二行：完整走法（所有國際業者 + 經過的網路）；和第一行一樣時不顯示
const cellChain = (t) => {
  const r = t.route || {};
  const full = r.chain_full ? I.chain(L, r.chain_full) : r.chain_full_text || "";
  return full && full !== cellMain(t) ? full : "";
};
// 格子小字：接入方式 · 延遲 · 推測 / 未到達
const cellMeta = (t) => {
  const r = t.route || {};
  return [I.access(L, r) || r.access, t.last_rtt != null ? t.last_rtt + " ms" : "", confText(t),
    t.reached === false ? T("unreached") : ""].filter(Boolean).join(" · ");
};

const ISP_COLS = ["ct", "cu", "cm"];
const openCell = {}; // 每台伺服器目前展開的目標 key
const tLabel = (t) => I.targetLabel(L, t);

// 地區：新版結果有省份代碼；舊版從「北京電信」推回「北京」；沒有電信商的自訂目標放在「其他」列
function regionOf(t) {
  if (t.region) return t.region;
  const r = String(t.label || "").replace(/(電信|电信|聯通|联通|移動|移动)$/, "").trim();
  return t.isp && r && r !== t.label ? r : "";
}
const regionName = (r) => (I.PROVINCES[r] ? I.province(L, r) : r);

function cellHTML(n, t, key) {
  if (!t) return `<div><span class="cell none">—</span></div>`;
  const rtt = t.last_rtt != null ? `${t.last_rtt} ms` : "";
  const body = t.error
    ? `<span class="chip ${ispColor(t)}">⚠ ${esc(I.error(L, t.error))}</span>`
    : `<span class="chip ${ispColor(t)}">${esc(cellMain(t) || "—")}</span>
       ${cellChain(t) ? `<span class="chain">${esc(cellChain(t))}</span>` : ""}
       <span class="meta">${esc(t.route && (t.route.short || t.route.chain) ? cellMeta(t) : rtt + (t.reached === false ? " · " + T("unreached") : ""))}</span>`;
  return `<div><button class="cell ${openCell[n.uuid] === key ? "on" : ""}" data-node="${esc(n.uuid)}" data-key="${esc(key)}" title="${esc(tLabel(t))}">${body}</button></div>`;
}

function detailHTML(t) {
  const segs = (t.segments || []).map((s) => {
    const ips = (s.ips || []).map((x) => (x === "LAN" || x === "內網" ? T("seg.lanIp") : x));
    return `
    <div class="seg ${s.key === "LAN" ? "lan" : ""}">
      <div class="asn">${esc(s.key)}</div>
      <div><div>${esc(I.segName(L, s))}${s.geo ? ` <span class="sub">· ${esc(s.geo)}${s.geo_orig ? esc(I.paren(L, T("seg.geoFixed", { x: s.geo_orig }))) : ""}</span>` : ""}</div>
        ${ips.length ? `<div class="ips">${ips.map(esc).join("　")}</div>` : ""}</div>
      <div class="hopn">${esc(T("page.hops", { n: s.hops }))}${s.timeouts ? ` +${s.timeouts}*` : ""}${s.rtt_out != null ? ` · ${s.rtt_out} ms` : ""}</div>
    </div>`;
  }).join("");
  const why = t.route ? `<div class="why">
      <div><b>${esc(T("page.why"))}</b>　${esc(I.evidence(L, t.route) || "—")}</div>
      <div><b>${esc(T("page.intl"))}</b>　${esc(I.intl(L, t.route) || "—")}</div>
    </div>` : "";
  return `<div class="detail">
    <div class="dh"><span class="label ${esc(t.isp)}">${esc(tLabel(t))}</span>
      ${t.big ? `<span class="sub">${esc(T("big.desc", { port: t.port, size: t.psize }))}</span>` : ""}
      ${t.error ? "" : `<span class="chip ${ispColor(t)}">${esc(tagText(t))}</span>`}
      <span class="spacer"></span><span class="rtt">${t.last_rtt != null ? t.last_rtt + " ms" : ""}</span></div>
    <span class="aspath">${esc(t.as_path || I.error(L, t.error) || "")}</span>
    <div class="segs">${why}${segs || `<div class="sub">${esc(T("page.noData"))}</div>`}</div>
  </div>`;
}

function nodeGrid(n, targets) {
  if (!targets.length) return `<div class="empty">${esc(T("page.noResult"))}</div>`;
  const regions = [];
  const byRegion = {};
  const others = [];
  targets.forEach((t) => {
    const key = tKey(t);
    const r = regionOf(t);
    if (!r) { others.push([t, key]); return; }
    if (!byRegion[r]) { byRegion[r] = {}; regions.push(r); }
    byRegion[r][t.isp] = [t, key];
  });
  let html = `<div class="grid"><div class="gh"></div>${ISP_COLS.map((c) => `<div class="gh ${c}">${esc(T("carrier." + c))}</div>`).join("")}`;
  for (const r of regions) {
    html += `<div class="rg">${esc(regionName(r))}</div>` + ISP_COLS.map((c) => {
      const hit = byRegion[r][c];
      return hit ? cellHTML(n, hit[0], hit[1]) : cellHTML(n, null);
    }).join("");
  }
  for (const [t, key] of others) html += `<div class="rg">${esc(T("page.other"))}</div><div class="other">${cellHTML(n, t, key).slice(5, -6)}</div>`;
  html += "</div>";
  const open = targets.find((t) => tKey(t) === openCell[n.uuid]);
  return html + (open ? detailHTML(open) : "");
}

function render(data) {
  isAdmin = !!data.admin && !EMBED;
  lastData = data;
  // 伺服器有被選入哪些版本（舊版 API 沒有 versions 時，從結果推回）
  const versOf = (n) => n.versions || [...new Set((n.targets || []).map((t) => t.v || 4))];
  const hasV4 = data.nodes.some((n) => versOf(n).includes(4));
  const hasV6 = data.nodes.some((n) => versOf(n).includes(6));
  if (!hasV6) ver = 4; else if (!hasV4) ver = 6;
  const toggle = hasV4 && hasV6 ? `<span class="seg-ctl"><button data-ver="4" class="${ver === 4 ? "on" : ""}">IPv4</button><button data-ver="6" class="${ver === 6 ? "on" : ""}">IPv6</button></span>` : "";
  // 有大包結果時才顯示「標準 / 大包」切換
  const hasBig = !!data.big && data.nodes.some((n) => (n.targets || []).some((t) => t.big && (t.v || 4) === ver));
  if (!hasBig) mode = "std";
  const modeCtl = hasBig ? `<span class="seg-ctl"><button data-mode="std" class="${mode === "std" ? "on" : ""}">${esc(T("page.modeStd"))}</button><button data-mode="big" class="${mode === "big" ? "on" : ""}">${esc(T("page.modeBig"))}</button></span>` : "";
  document.getElementById("sub").textContent = T("page.sub", { n: data.interval }) +
    (mode === "big" && data.big ? " · " + T(data.big.port ? "big.desc" : "big.descAuto", { port: data.big.port, size: data.big.psize }) : "");
  document.getElementById("actions").innerHTML = toggle + modeCtl + (isAdmin ? `<button id="runall">${esc(T("page.runAll"))}</button>` : "");
  const list = document.getElementById("list");
  // 只列出有被選入目前分頁版本的伺服器
  const nodes = data.nodes.filter((n) => versOf(n).includes(ver));
  if (!nodes.length) { list.innerHTML = `<div class="empty">${esc(T("page.noNodes", { v: ver }))}</div>`; return; }
  list.innerHTML = nodes.map((n) => {
    const targets = (n.targets || []).filter((t) => (t.v || 4) === ver && !!t.big === (mode === "big"));
    const src = ver === 6 ? n.src6_masked : n.src_masked;
    return `<div class="node">
      <div class="nhead">
        <span class="name">${esc(n.name)}</span>
        ${src ? `<span class="ip">${esc(src)}</span>` : ""}
        <span class="spacer"></span>
        <span class="sub">${esc(n.running ? T("page.running") : I.ago(L, n.updated_at))}${n.tool ? " · " + esc(n.tool) : ""}</span>
        ${isAdmin ? `<button data-run="${esc(n.uuid)}" ${n.running ? "disabled" : ""}>${esc(T("page.run"))}</button>` : ""}
      </div>
      ${n.error ? `<div class="err">${esc(I.error(L, n.error))}</div>` : ""}
      ${nodeGrid(n, targets)}
    </div>`;
  }).join("");
}

const errText = (e, status) => (e ? I.error(L, e) : String(status));

async function refresh() {
  relang();
  try {
    const r = await fetch("/api/cnroute/data", { credentials: "same-origin" });
    const d = await r.json();
    if (!r.ok) throw new Error(errText(d.error, r.status));
    render(d);
  } catch (e) {
    document.getElementById("sub").textContent = T("page.loadFail", { x: e.message });
  }
}

async function run(uuid) {
  const q = uuid ? "?uuid=" + encodeURIComponent(uuid) : "";
  const r = await fetch("/api/cnroute/run" + q, { method: "POST", credentials: "same-origin" });
  const d = await r.json().catch(() => ({}));
  if (!r.ok || d.error) alert(T("page.runFail", { x: errText(d.error, r.status) }));
  refresh();
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  e.preventDefault();
  if (b.dataset.node) {
    openCell[b.dataset.node] = openCell[b.dataset.node] === b.dataset.key ? "" : b.dataset.key;
    if (lastData) render(lastData);
  } else if (b.dataset.ver) {
    ver = Number(b.dataset.ver);
    try { localStorage.setItem("cnroute-ver", String(ver)); } catch (_) {}
    if (lastData) render(lastData);
  } else if (b.dataset.mode) {
    mode = b.dataset.mode === "big" ? "big" : "std";
    try { localStorage.setItem("cnroute-mode", mode); } catch (_) {}
    if (lastData) render(lastData);
  } else if (b.id === "runall") run("");
  else if (b.dataset.run) { b.disabled = true; run(b.dataset.run); }
});

refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
